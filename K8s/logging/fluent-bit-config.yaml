
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: robot-shop
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*_robot-shop_*.log
        Parser            cri
        Tag               robot-shop.*
        Refresh_Interval  5
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

    [FILTER]
        Name          modify
        Match         robot-shop.*
        Add           project capstone-robot-shop

    [OUTPUT]
        Name          loki
        Match         robot-shop.*
        Host          loki.robot-shop.svc.cluster.local
        Port          3100
        Labels        job=robot-shop, namespace=robot-shop
        Label_Keys    $kubernetes['container_name']
        Line_Format   json

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
